name: tria_esp32
version: 1.0.0
description: ESP32 (Heltec WiFi LoRa 32 V3) - Nó de atuação do TRIA
# Firmware baseado no Heltec WiFi LoRa 32 V3 (ESP32-S3 + OLED U8G2)

platform: espressif32
board: heltec_wifi_lora32_v3
framework: arduino

monitor_speed: 115200

lib_deps:
  # Driver do servo
  - ESP32Servo

  # Cliente MQTT
  - knolleary/PubSubClient@^2.8

  # Driver OLED (Heltec)
  - olikraus/U8g2@^2.34

; Dependências de exemplo (comentar se usar PlatformIO)
; ESP32 Servo: https://registry.platformio.org/libraries/ESP32Servo/ESP32Servo
; PubSubClient: https://registry.platformio.org/libraries/knolleary/PubSubClient
; U8g2: https://registry.platformio.org/libraries/olikraus/U8g2