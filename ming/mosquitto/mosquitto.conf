# Configuração Mosquitto - TRIA PoC Física
# Arquivo: ming/mosquitto/mosquitto.conf

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# Log
log_type all
log_dest stderr
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Persistência (mensagens retain e Last Will)
persistence true
persistence_location /mosquitto/data/

# Tamanho máximo de mensagem (bytes)
message_size_limit 1024

# Gateway para debugging: mapeia tópicos com %c (clientid) e %t (topic)
# Exemplo de payload: tria/triagem publish para debug